name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $manifest = Import-PowerShellDataFile -Path ./IntuneShell/IntuneShell.psd1
          foreach ($required in $manifest.RequiredModules)
          {
              $name = if ($required -is [hashtable]) { $required.ModuleName } else { $required }
              Write-Host "Installing required module $name"
              Install-Module -Name $name -Scope CurrentUser -Force
          }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate manifest
        id: manifest
        shell: pwsh
        run: |
          $m = Test-ModuleManifest -Path ./IntuneShell/IntuneShell.psd1 -ErrorAction Stop
          Write-Host "Validated $($m.Name) $($m.Version)"
          "version=$($m.Version)" >> $env:GITHUB_OUTPUT

      - name: Lint (errors only)
        shell: pwsh
        run: |
          $errors = Invoke-ScriptAnalyzer -Path ./IntuneShell -Recurse -Severity Error
          $errors | Format-Table -AutoSize
          if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }

      - name: Import test
        shell: pwsh
        run: |
          Import-Module ./IntuneShell/IntuneShell.psd1 -Force -ErrorAction Stop
          $exported = (Get-Module IntuneShell).ExportedFunctions.Keys
          Write-Host "Exported: $($exported -join ', ')"
          if (-not $exported) { throw 'Module exports no functions.' }

      - name: Check if version is already published
        id: gallery
        shell: pwsh
        run: |
          $version = '${{ steps.manifest.outputs.version }}'
          $existing = Find-Module -Name IntuneShell -RequiredVersion $version -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing) { Write-Host "Version $version already on PSGallery; skipping publish. Bump ModuleVersion to release." }
          "exists=$([bool]$existing)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Publish
        if: steps.gallery.outputs.exists != 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { throw 'Secret PSGALLERY_API_KEY is not set.' }
          Publish-Module -Path ./IntuneShell -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery -Verbose
